services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-change-me-in-prod}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-prod}
      DATABASE_URL: postgresql://postgres:postgres@db:5432/flask_api
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flask_api
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flask_api"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
